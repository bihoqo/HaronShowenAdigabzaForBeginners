plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mastegoane.adigabzaforbeginners'
    compileSdk 36

    defaultConfig {
        applicationId "com.mastegoane.adigabzaforbeginners"
        minSdk 26
        targetSdk 36
        versionCode 76
        versionName "1.75"
        resConfigs 'en', 'ar', 'tr', 'ady'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Next is to force the build to contain all the languages (locales) instead of splitting by language.
    // Solves a problem where some languages don't work for some users.
    bundle {
        language {
            // Specifies that the app bundle should not support
            // configuration APKs for language resources. These
            // resources are instead packaged with each base and
            // dynamic feature APK.
            enableSplit = false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        dataBinding true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.11.0"
    // LiveData
    implementation "androidx.lifecycle:lifecycle-livedata:2.11.0"
    // OnBackPressedCallback for predictive back handling
    implementation 'androidx.activity:activity:1.13.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // ROOM
    def room_version = "2.8.5"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // DialogPlus from https://github.com/orhanobut/dialogplus
    implementation 'com.orhanobut:dialogplus:1.11@aar'
}
